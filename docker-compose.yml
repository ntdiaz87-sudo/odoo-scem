services:
  web:
    image: odoo:17.0
    container_name: odoo_scem
    depends_on:
      - db
    ports:
      - "8269:8069"
      - "8272:8072"
    volumes:
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
      - odoo-web-data:/var/lib/odoo
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo_pass
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: odoo_scem_db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo_pass
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  odoo-web-data:
  odoo-db-data: