# Override de AMBIENTE DE PRUEBAS en un servidor con IP pública (sin dominio):
# usa <IP>.nip.io como dominio raíz en el puerto 8300, para convivir con otros
# proyectos que ya ocupen 80/443. Lo aplica factory/deploy/bootstrap-test.sh.
services:
  vendure:
    environment:
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      COOKIE_SECRET: ${COOKIE_SECRET}

  web:
    environment:
      VENDURE_SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      NEXT_PUBLIC_ROOT_DOMAIN: ${FACTORY_HOST}:8300
      NEXT_PUBLIC_ROOT_URL: http://${FACTORY_HOST}:8300
