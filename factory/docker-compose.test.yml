# Override de AMBIENTE DE PRUEBAS en un servidor con IP pública (sin dominio):
# usa <IP>.nip.io como dominio raíz y expone la web en el puerto 80.
# Lo aplica factory/deploy/bootstrap-test.sh; no usar en local.
services:
  vendure:
    environment:
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      COOKIE_SECRET: ${COOKIE_SECRET}

  web:
    ports:
      - '80:3000'
    environment:
      VENDURE_SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      NEXT_PUBLIC_ROOT_DOMAIN: ${SERVER_IP}.nip.io
      NEXT_PUBLIC_ROOT_URL: http://${SERVER_IP}.nip.io
