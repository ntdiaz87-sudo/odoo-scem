# CI/CD al estilo de la casa (calcado del patrón Qbaprotic, runner en modo host):
# push a develop → fetch+reset del clon en /opt/fabrica → compose up → verificación.
# Reglas del runner gex44: SOLO pasos `run:` (sin actions JS) y sin `services:`.
# Aplica cuando la fábrica vive en su repo de Gitea con el contenido de factory/
# en la raíz. En GitHub este fichero es inerte.
name: Desplegar fábrica (test)

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: gex44
    steps:
      - name: Traer develop
        run: |
          set -e
          git -C /opt/fabrica fetch origin --prune --force
          git -C /opt/fabrica reset --hard origin/develop
          git -C /opt/fabrica log -1 --oneline

      - name: Levantar el stack
        run: |
          set -e
          cd /opt/fabrica/infra
          docker compose --env-file ../.env -f docker-compose.prod.yml up -d --build

      - name: Verificar
        run: |
          set -e
          HOST=$(grep '^FACTORY_HOST=' /opt/fabrica/.env | cut -d= -f2)
          COD=000
          for i in $(seq 1 30); do
            COD=$(curl -s -o /dev/null -w "%{http_code}" "https://$HOST/" || true)
            [ "$COD" = "200" ] && echo "OK $COD" && exit 0
            sleep 4
          done
          echo "FALLO: $COD"
          docker logs --tail 50 fabrica-web-1 || true
          docker logs --tail 50 fabrica-vendure-1 || true
          exit 1
