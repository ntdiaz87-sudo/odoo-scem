# CI/CD al estilo de la casa (como Bussiness): push a develop → despliegue a test.
# Este workflow aplica cuando la fábrica viva en su repo propio de Gitea
# (contenido de factory/ en la raíz del repo). En GitHub este fichero es inerte.
#
# AJUSTAR ANTES DE ACTIVAR (ver deploy/README.md):
#   - runs-on: el label real del runner de GEX44 (igual que usa Bussiness).
name: Desplegar fábrica a test

on:
  push:
    branches: [develop]

jobs:
  deploy-test:
    runs-on: self-hosted # TODO: label real del runner del GEX44
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sincronizar código a /opt/fabrica
        run: |
          mkdir -p /opt/fabrica
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.env.test' \
            ./ /opt/fabrica/

      - name: Desplegar ambiente de test
        run: bash /opt/fabrica/deploy/apply-test.sh
