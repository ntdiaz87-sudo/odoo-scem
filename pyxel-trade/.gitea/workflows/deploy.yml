# Despliegue automático en el GEX44, calcado del patrón que ya funciona en
# la fábrica de tiendas (factory/.gitea/workflows/deploy-test.yml).
#
# El runner `gex44` corre en MODO HOST, como root, sobre el servidor real.
# De ahí las tres reglas de la casa que este workflow respeta:
#   - Sólo pasos `run:`. Ninguna acción JS, ni siquiera actions/checkout.
#   - Nada de `services:`.
#   - Ve /opt y habla con el Docker de verdad.

name: deploy

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: gex44
    steps:
      - name: Traer develop
        run: |
          set -e
          git -C /opt/pyxel-trade fetch origin --prune --force
          git -C /opt/pyxel-trade reset --hard origin/develop
          git -C /opt/pyxel-trade log -1 --oneline

      - name: Regenerar la configuración de Odoo
        run: |
          set -e
          cd /opt/pyxel-trade
          # Los secretos entran desde el .env del servidor; al repositorio
          # sólo va la plantilla. El script tolera que no haya envsubst.
          bash scripts/render-config.sh

      - name: Actualizar los módulos
        run: |
          set -e
          cd /opt/pyxel-trade
          set -a; . ./.env; set +a
          cd infra
          compose="docker compose --env-file ../.env -f docker-compose.prod.yml"

          $compose up -d db
          # Se para el web antes de migrar el esquema: actualizar con
          # workers sirviendo peticiones da errores intermitentes.
          $compose stop odoo || true
          $compose run --rm --no-deps odoo \
              odoo -d "$ODOO_DB" -u "$ODOO_UPDATE_MODULES" --stop-after-init
          $compose up -d

      - name: Verificar
        run: |
          set -e
          cd /opt/pyxel-trade
          set -a; . ./.env; set +a
          compose="docker compose --env-file /opt/pyxel-trade/.env -f /opt/pyxel-trade/infra/docker-compose.prod.yml"

          # Espera activa en vez de un sleep fijo: tras actualizar módulos,
          # Odoo tarda lo que tarde en regenerar los assets, y un sleep
          # corto daría por fallido un despliegue que iba bien.
          COD=000
          for i in $(seq 1 45); do
            COD=$(curl -s -o /dev/null -w "%{http_code}" "https://$PYXEL_HOST/web/health" || true)
            [ "$COD" = "200" ] && break
            sleep 4
          done

          if [ "$COD" != "200" ]; then
            echo "FALLO: /web/health devolvió $COD"
            $compose logs --tail 60 odoo || true
            $compose logs --tail 30 db || true
            exit 1
          fi
          echo "Odoo responde ($COD). Prueba de humo:"
          bash scripts/smoke.sh "$PYXEL_HOST"
