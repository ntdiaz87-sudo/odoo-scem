# PYXEL Cuba Trade OS — Odoo 19 + PostgreSQL 16 + Caddy (TLS automático)
#
#   docker compose up -d
#
# Caddy obtiene y renueva el certificado de Let's Encrypt solo. Para que
# funcione, el dominio de PYXEL_DOMAIN debe resolver ya a este servidor y
# los puertos 80 y 443 deben estar abiertos.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Odoo crea sus bases con su propia plantilla; este initdb sólo aplica
      # al clúster la primera vez.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # La base NO se expone a Internet: sólo la ve la red interna de Docker.
    networks:
      - backend

  odoo:
    image: odoo:19
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons
    networks:
      - backend
      - frontend

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "80:80"
      - "443:443"
    environment:
      PYXEL_DOMAIN: ${PYXEL_DOMAIN}
      PYXEL_ACME_EMAIL: ${PYXEL_ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - frontend

volumes:
  db-data:
  odoo-data:
  caddy-data:
  caddy-config:

networks:
  # `backend` no tiene salida a Internet ni entrada desde fuera.
  backend:
  frontend:
